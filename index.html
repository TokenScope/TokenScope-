<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TokenScope — Curated Crypto Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#070b12;--panel:#0d1420;--panel2:#111b29;--text:#f4f7fb;--muted:#8e9aab;--line:#1d2a3a;--accent:#64f2a4;--danger:#ff6b7a;--warn:#ffd166}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#070b12,#09111c);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    button,input,select{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:1180px;margin:auto;padding:22px}
    header{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font-size:24px;font-weight:800}.brand span{color:var(--accent)}
    .tag{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border-radius:10px;background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.primary{background:var(--accent);color:#06110b;border-color:var(--accent);font-weight:800}.btn.danger{color:#ffdce0;border-color:#4b2028}
    .hero{padding:28px;border:1px solid var(--line);border-radius:20px;background:radial-gradient(circle at 85% 15%,#123021 0,transparent 30%),var(--panel);margin-bottom:18px}.hero h1{font-size:clamp(28px,5vw,48px);margin:0 0 10px}.hero p{color:var(--muted);max-width:760px;margin:0;line-height:1.6}
    .bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.search{flex:1;min-width:220px;padding:13px 15px;background:#0a111b;border:1px solid var(--line);border-radius:12px;color:var(--text);outline:none}.select{padding:13px;background:#0a111b;border:1px solid var(--line);border-radius:12px;color:var(--text)}
    .status{font-size:12px;color:var(--muted);margin:8px 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.top{display:flex;justify-content:space-between;gap:12px}.coin{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:50%;background:#172334;object-fit:cover}.name{font-weight:800}.symbol{font-size:12px;color:var(--muted)}.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:#13261e;color:var(--accent);border:1px solid #1f4b37;text-transform:capitalize}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.metric{padding:10px;border-radius:10px;background:#0a111b}.metric small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.metric b{font-size:14px}.up{color:var(--accent)}.down{color:var(--danger)}.note{font-size:12px;color:var(--muted);line-height:1.5}.empty{padding:30px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
    .modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.box{width:min(620px,100%);background:#0c131e;border:1px solid var(--line);border-radius:18px;padding:20px}.box h2{margin-top:0}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;background:#080e17;border:1px solid var(--line);border-radius:10px;color:var(--text)}.field textarea{min-height:80px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.close{float:right;background:none;color:var(--muted);font-size:22px}.admin-list{margin-top:18px}.admin-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px;border-top:1px solid var(--line)}footer{padding:28px 0;color:var(--muted);font-size:11px;text-align:center}
    @media(max-width:600px){.wrap{padding:14px}.row{grid-template-columns:1fr}header{align-items:flex-start}.hero{padding:20px}}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="brand">Token<span>Scope</span></div><div class="tag">Curated token discovery • live market metrics</div></div>
    <div class="actions"><button class="btn" id="refreshBtn">Refresh</button><button class="btn" id="loginBtn">Admin</button></div>
  </header>

  <section class="hero"><h1>Find tokens worth watching.</h1><p>TokenScope is a curated scanner. Tokens are manually published by the owner; market metrics are refreshed from live DEX data.</p></section>

  <div class="bar"><input id="search" class="search" placeholder="Search published tokens…"/><select id="chain" class="select"><option value="">All chains</option><option value="solana">Solana</
